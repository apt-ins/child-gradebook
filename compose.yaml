services:
  gradebook:
    build: .
    image: child-gradebook:local
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-3082}:3000"
    environment:
      NODE_ENV: production
      DATA_DIR: /app/data
      HA_INTERNAL_URL: "${HA_INTERNAL_URL:?请在 .env 中设置 HA_INTERNAL_URL}"
      SECURE_COOKIE: "${SECURE_COOKIE:-auto}"
      FRAME_ANCESTORS: "${FRAME_ANCESTORS:?请在 .env 中设置 FRAME_ANCESTORS}"
      TRUSTED_PROXY_CIDRS: "${TRUSTED_PROXY_CIDRS:-}"
      TZ: Asia/Shanghai
    volumes:
      - ./data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=128m
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
