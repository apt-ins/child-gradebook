services:
  gradebook:
    build: .
    image: xueji-standalone:local
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3082}:3000"
    environment:
      NODE_ENV: production
      DATA_DIR: /app/data
      SECURE_COOKIE: "${SECURE_COOKIE:-auto}"
      TRUSTED_PROXY_CIDRS: "${TRUSTED_PROXY_CIDRS:-}"
      TZ: Asia/Shanghai
    volumes:
      - ./data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=128m
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
