name: 本地 App 编译验证
on:
  workflow_dispatch:
  push:
    branches: [mobile-app]
permissions:
  contents: read
jobs:
  ios:
    name: iOS 无签名编译（不能直接安装）
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: 使用 Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run mobile:sync
      - run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -derivedDataPath artifacts/ios-build CODE_SIGNING_ALLOWED=NO build
      - run: |
          mkdir -p artifacts/ios-package/Payload
          cp -R artifacts/ios-build/Build/Products/Release-iphoneos/App.app artifacts/ios-package/Payload/
          cd artifacts/ios-package
          zip -qr ../xueji-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: xueji-ios-unsigned-not-installable
          path: artifacts/xueji-ios-unsigned.ipa
  android:
    name: Android 编译检查（无签名）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm test
      - run: npm run mobile:sync
      - run: cd android && chmod +x gradlew && ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: xueji-android-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
