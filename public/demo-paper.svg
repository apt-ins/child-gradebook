<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 860"><rect width="620" height="860" fill="#f2f3f0"/><g fill="#394453" font-family="sans-serif"><text x="310" y="64" text-anchor="middle" font-size="24">五年级语文 · 期中练习</text><text x="310" y="98" text-anchor="middle" font-size="13" fill="#758090">示例试卷 · 非真实成绩</text><path d="M48 123h524" stroke="#89919a"/><text x="50" y="160" font-size="16">一、读一读，写一写。</text><text x="50" y="270" font-size="16">二、把喜欢的句子摘抄下来。</text><text x="50" y="445" font-size="16">三、写一件让你感到快乐的小事。</text><text x="73" y="495" font-size="17" fill="#62788e">今天，我勇敢地举起了手……</text></g><g stroke="#c2c9ce" fill="none"><path d="M50 194h518M50 231h518M50 312h518M50 352h518M50 392h518M50 510h518M50 553h518M50 596h518M50 639h518M50 682h518M50 725h518"/><path d="M110 170v62M175 170v62M240 170v62M305 170v62M370 170v62M435 170v62M500 170v62"/></g><g fill="#ae5961" font-family="sans-serif"><text x="495" y="155" font-size="43" transform="rotate(-8 495 155)">92</text><text x="380" y="775" font-size="17" transform="rotate(-5 380 775)">写出了自己的感受，很棒！</text></g></svg>
